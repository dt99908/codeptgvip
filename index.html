<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Together Giftcode Redeemer</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
    
    <!-- Header -->
    <div class="bg-indigo-600 p-6 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-white/10 rounded-full mb-3 text-white text-2xl">
        <i class="fa-solid fa-gift"></i>
      </div>
      <h1 class="text-xl font-bold text-white">Play Together Giftcode</h1>
      <p class="text-indigo-200 text-xs mt-1">Nhập Game ID & Mã Giftcode để nhận quà</p>
    </div>

    <!-- Form Input -->
    <div class="p-6 space-y-4">
      <div>
        <label for="userId" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Game ID (User ID)
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="userId" placeholder="Nhập Game ID của bạn" 
            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-100 placeholder-slate-500 outline-none transition text-sm">
        </div>
      </div>

      <div>
        <label for="couponCode" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Mã Giftcode / Coupon
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <i class="fa-solid fa-ticket"></i>
          </span>
          <input type="text" id="couponCode" placeholder="Nhập mã code quà tặng" 
            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-100 placeholder-slate-500 outline-none transition text-sm uppercase">
        </div>
      </div>

      <button id="btnSubmit" onclick="handleRedeem()" 
        class="w-full mt-2 py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <i id="btnIcon" class="fa-solid fa-paper-plane"></i>
        <span id="btnText">Nhận Quà</span>
      </button>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden p-4 rounded-xl text-xs font-medium border space-y-1">
        <div class="flex items-center space-x-2 font-bold text-sm">
          <i id="alertIcon"></i>
          <span id="alertTitle">Thành công</span>
        </div>
        <p id="alertMessage" class="pl-6 text-slate-300"></p>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-slate-950/50 border-t border-slate-800 text-center">
      <p class="text-xs text-slate-500">Hệ thống xử lý tự động qua Serverless API</p>
    </div>

  </div>

  <script>
    async function handleRedeem() {
      const userIdInput = document.getElementById('userId');
      const couponCodeInput = document.getElementById('couponCode');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const alertBox = document.getElementById('alertBox');
      const alertIcon = document.getElementById('alertIcon');
      const alertTitle = document.getElementById('alertTitle');
      const alertMessage = document.getElementById('alertMessage');

      const userId = userIdInput.value.trim();
      const couponCode = couponCodeInput.value.trim();

      if (!userId || !couponCode) {
        showAlert('error', 'Chưa đủ thông tin', 'Vui lòng điền đầy đủ Game ID và Mã Giftcode!');
        return;
      }

      // Trạng thái Loading
      btnSubmit.disabled = true;
      btnIcon.className = 'fa-solid fa-spinner animate-spin';
      btnText.innerText = 'Đang xử lý...';
      alertBox.classList.add('hidden');

      try {
        // Gửi request đến Serverless Function vừa tạo
        const response = await fetch('/api/redeem', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            user_code: userId,
            coupon_code: couponCode
          })
        });

        const data = await response.json();

        // Kiểm tra phản hồi
        if (response.ok && (data.ret === 0 || data.code === 0 || data.success === true)) {
          const msg = data.msg || data.message || 'Code hợp lệ! Vui lòng kiểm tra hộp thư trong game.';
          showAlert('success', 'Thành Công!', msg);
        } else {
          const errorMsg = data.msg || data.message || data.error || 'Mã code không đúng, đã hết hạn hoặc đã được sử dụng.';
          showAlert('error', 'Không Thể Nhận Quà', errorMsg);
        }
      } catch (error) {
        showAlert('error', 'Lỗi Kết Nối', 'Không thể gửi yêu cầu tới máy chủ. Vui lòng kiểm tra kết nối mạng.');
      } finally {
        // Đặt lại trạng thái Nút bấm
        btnSubmit.disabled = false;
        btnIcon.className = 'fa-solid fa-paper-plane';
        btnText.innerText = 'Nhận Quà';
      }
    }

    function showAlert(type, title, message) {
      const alertBox = document.getElementById('alertBox');
      const alertIcon = document.getElementById('alertIcon');
      const alertTitle = document.getElementById('alertTitle');
      const alertMessage = document.getElementById('alertMessage');

      alertBox.classList.remove('hidden', 'bg-emerald-950/50', 'border-emerald-800', 'text-emerald-400', 'bg-rose-950/50', 'border-rose-800', 'text-rose-400');

      if (type === 'success') {
        alertBox.classList.add('bg-emerald-950/50', 'border-emerald-800', 'text-emerald-400');
        alertIcon.className = 'fa-solid fa-circle-check';
      } else {
        alertBox.classList.add('bg-rose-950/50', 'border-rose-800', 'text-rose-400');
        alertIcon.className = 'fa-solid fa-circle-xmark';
      }

      alertTitle.innerText = title;
      alertMessage.innerText = message;
    }
  </script>
</body>
</html>
